<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" role="img" aria-label="Mockup illustration of DHARM AI Decision web development project">
  <defs>
    <linearGradient id="dharm-bg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="1" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#dharm-bg)" />

  <!-- Web Browser Mockup Window -->
  <rect x="30" y="25" width="540" height="290" rx="12" fill="#0f172a" stroke="#4338ca" stroke-width="1.5" />
  
  <!-- Browser Chrome Top Bar -->
  <rect x="30" y="25" width="540" height="36" rx="12" fill="#1e1b4b" />
  <circle cx="52" cy="43" r="5" fill="#ef4444" />
  <circle cx="68" cy="43" r="5" fill="#f59e0b" />
  <circle cx="84" cy="43" r="5" fill="#10b981" />
  
  <!-- Address Bar -->
  <rect x="110" y="34" width="280" height="18" rx="9" fill="#312e81" />
  <text x="130" y="47" font-family="sans-serif" font-size="10" fill="#c7d2fe">https://dharm-ai-decision.local/dashboard</text>

  <text x="540" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="end">DHARM AI</text>

  <!-- Left Panel: Input Parameters &amp; Decision Criteria -->
  <rect x="50" y="75" width="220" height="225" rx="8" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
  <text x="65" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e0e7ff">Decision Input Criteria</text>
  
  <!-- Form input mockup rows -->
  <rect x="65" y="115" width="190" height="28" rx="4" fill="#312e81" />
  <text x="75" y="133" font-family="sans-serif" font-size="10" fill="#a5b4fc">Criteria: System Reliability</text>

  <rect x="65" y="152" width="190" height="28" rx="4" fill="#312e81" />
  <text x="75" y="170" font-family="sans-serif" font-size="10" fill="#a5b4fc">Factor: Constraints &amp; Bounds</text>

  <rect x="65" y="189" width="190" height="28" rx="4" fill="#312e81" />
  <text x="75" y="207" font-family="sans-serif" font-size="10" fill="#a5b4fc">Weighting: Multi-Objective</text>

  <!-- Process Button -->
  <rect x="65" y="235" width="190" height="34" rx="6" fill="url(#ai-glow)" />
  <text x="160" y="256" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Evaluate Decision &#x2192;</text>

  <!-- Right Panel: AI Evaluation &amp; Decision Output -->
  <rect x="290" y="75" width="260" height="225" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
  <text x="305" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e0e7ff">AI Decision Analysis</text>
  
  <!-- Confidence Bar -->
  <rect x="305" y="120" width="230" height="12" rx="6" fill="#312e81" />
  <rect x="305" y="120" width="195" height="12" rx="6" fill="url(#ai-glow)" />
  <text x="305" y="148" font-family="sans-serif" font-size="10" fill="#c7d2fe">Confidence Score: 88.4% (Optimal)</text>

  <!-- Output Decision Card -->
  <rect x="305" y="165" width="230" height="75" rx="6" fill="#18181b" stroke="#6366f1" stroke-width="1.5" />
  <text x="318" y="190" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">&#x2714; Recommended Strategy</text>
  <text x="318" y="210" font-family="sans-serif" font-size="10" fill="#cbd5e1">Actionable recommendation based</text>
  <text x="318" y="225" font-family="sans-serif" font-size="10" fill="#cbd5e1">on multi-attribute evaluation logic.</text>

  <rect x="305" y="255" width="230" height="26" rx="4" fill="#312e81" />
  <text x="420" y="272" font-family="sans-serif" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">Responsive Web Interface</text>
</svg>
