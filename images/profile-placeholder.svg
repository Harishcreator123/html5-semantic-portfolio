<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Vector illustration of a Computer and Communication Engineering student">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <rect width="400" height="400" rx="32" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Lines representing Communication Networks -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5">
    <line x1="40" y1="100" x2="360" y2="100" />
    <line x1="40" y1="200" x2="360" y2="200" />
    <line x1="40" y1="300" x2="360" y2="300" />
    <line x1="100" y1="40" x2="100" y2="360" />
    <line x1="200" y1="40" x2="200" y2="360" />
    <line x1="300" y1="40" x2="300" y2="360" />
    <!-- Network Nodes -->
    <circle cx="100" cy="100" r="4" fill="#38bdf8" />
    <circle cx="200" cy="100" r="4" fill="#38bdf8" />
    <circle cx="300" cy="200" r="4" fill="#38bdf8" />
    <circle cx="100" cy="300" r="4" fill="#38bdf8" />
    <circle cx="300" cy="300" r="4" fill="#38bdf8" />
  </g>

  <!-- Student Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="50" fill="#f8fafc" />
  <!-- Hair / Cap accent -->
  <path d="M 150 145 C 150 105 250 105 250 145 C 240 120 215 110 200 110 C 185 110 160 120 150 145 Z" fill="#0f172a" />
  
  <!-- Shoulders & Torso -->
  <path d="M 120 290 C 120 220 160 215 200 215 C 240 215 280 220 280 290 Z" fill="#f8fafc" />
  
  <!-- Engineering Tech Badge / Laptop in front -->
  <rect x="130" y="270" width="140" height="90" rx="8" fill="#0f172a" stroke="url(#accent-grad)" stroke-width="3" />
  <!-- Laptop screen content code tags -->
  <text x="200" y="320" font-family="monospace" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/CCE&gt;</text>
  <line x1="155" y1="335" x2="245" y2="335" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
</svg>
